[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "sonic-mcp"
version = "0.1.0"
description = "MCP server for Sonic Pi beat-making via Claude Code"
license = { text = "MIT" }
requires-python = ">=3.11"
dependencies = [
    "mcp>=1.0.0",
    "python-osc>=1.8.0",
]

[project.scripts]
sonic-mcp = "sonic_mcp.server:main"

[tool.hatch.build.targets.wheel]
packages = ["sonic_mcp"]
